syntax = "proto3";

package wuzz.user.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/koobam/wuzz-backend/gen/wuzz/user/v1;userv1";

// UserService is the command side of identity: it verifies a phone number by
// SMS code, mints sessions, and owns the customer accounts table.
//
// There is no password or PIN — a phone number proved by a one-time code is
// the entire credential, matching the app's actual sign-up/sign-in flow.
service UserService {
  // Register starts phone verification for a would-be account and stashes
  // the submitted profile until VerifyOtp claims it. It does not create a row
  // in `users` yet — an unverified phone number should not occupy a unique
  // username before anyone has proven they own the number.
  rpc Register(RegisterRequest) returns (RegisterResponse);

  // VerifyOtp checks the code, and on success either creates the account
  // (first time) or signs in the existing one (the same number registering
  // again), then issues a session. One call because the mobile app's login
  // and signup are the same screen: enter a phone number, get a code.
  rpc VerifyOtp(VerifyOtpRequest) returns (VerifyOtpResponse);
  // DEVELOPMENT ONLY: signs an existing customer in by phone with no code. The
  // service answers NotFound unless it runs with APP_ENV=dev and TWILIO_DEV_MODE.
  rpc DevLogin(DevLoginRequest) returns (DevLoginResponse);

  rpc SuggestUsername(SuggestUsernameRequest) returns (SuggestUsernameResponse);
  rpc CheckUsername(CheckUsernameRequest) returns (CheckUsernameResponse);

  // GetUser reads the caller's own profile. The caller is whoever the access
  // token in the request's metadata names — there is no user id field to spoof.
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  // The caller's level, points, usable voucher count and wallet balance.
  rpc GetMemberSummary(GetMemberSummaryRequest) returns (GetMemberSummaryResponse);

  // SendLoginCode starts sign-in for an EXISTING staff account (one with roles).
  // It never reveals whether the number is known: it succeeds either way, and
  // only sends a code when there is a staff account to sign in to.
  rpc SendLoginCode(SendLoginCodeRequest) returns (SendLoginCodeResponse);

  // ListUsers and SetUserStatus are admin-only (the `admin` role in the token).
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  rpc SetUserStatus(SetUserStatusRequest) returns (SetUserStatusResponse);
  // ResolveCustomers finds customers by id or by phone number, in one call (admin-only). A number is matched after the same
  // normalisation sign-up applies. What is not found is listed as unmatched.
  rpc ResolveCustomers(ResolveCustomersRequest) returns (ResolveCustomersResponse);

  // ListAccounts lists back-office admins or staff (not customers); admin-only like ListUsers.
  rpc ListAccounts(ListAccountsRequest) returns (ListAccountsResponse);

  rpc Refresh(RefreshRequest) returns (RefreshResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
}

message User {
  string id = 1;
  string username = 2;
  string name = 3;
  string phone = 4;
  string email = 5;
  int64 points = 6;
  int64 streak = 7;
  int64 xp = 8;
  string date_of_birth = 9;
  string status = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
  repeated string roles = 13;
}

message Session {
  string access_token = 1;
  string refresh_token = 2;
  User user = 3;
  google.protobuf.Timestamp access_token_expires_at = 4;
}

message RegisterRequest {
  string username = 1;
  string name = 2;
  string phone = 3;
  string email = 4;
  string date_of_birth = 5;
}

message RegisterResponse {
  string phone = 1;
  google.protobuf.Timestamp expires_at = 2;
}

message VerifyOtpRequest {
  string phone = 1;
  string otp_code = 2;
  // Empty for the customer app. "backoffice" requires the admin role; "pos"
  // requires an outlet role (or admin). A signed-in customer asking for either
  // gets 403 instead of a token that merely would not authorise anything.
  string audience = 3;
}

message SendLoginCodeRequest {
  string phone = 1;
}

message SendLoginCodeResponse {
  google.protobuf.Timestamp expires_at = 1;
}

message ListUsersRequest {
  string query = 1;   // matches username, name or phone
  string status = 2;  // active | inactive | banned, or empty
  int32 limit = 3;
  int32 offset = 4;
  // id, name, created_at or points. With neither sort field set, newest first (id desc); with a column and no direction, ascending.
  string sort_by = 5;
  string sort_dir = 6;
}

message ListUsersResponse {
  repeated User users = 1;
  int64 total = 2;
}

message ResolveCustomersRequest {
  repeated string ids = 1;
  repeated string phones = 2;
}

message ResolveCustomersResponse {
  repeated User users = 1;
  // The ids and phone numbers, as they were asked for, that matched nobody.
  repeated string unmatched = 2;
}

// An admin or a staff member. A customer is a User.
message Account {
  string id = 1;     // "a:7" for an admin, "s:3" for staff
  string kind = 2;   // admin | staff
  string name = 3;
  string phone = 4;
  string role = 5;   // admin: super, finance, support; staff: front, wuzzer
  int64 outlet_id = 6; // 0 when not tied to an outlet
  string status = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message ListAccountsRequest {
  string kind = 1;    // admin | staff
  string query = 2;   // matches name or phone
  string status = 3;  // active | inactive | banned, or empty
  int32 limit = 4;
  int32 offset = 5;
  // Only the accounts tied to this outlet (0 = no filter).
  int64 outlet_id = 6;
  // id, name or created_at. With neither sort field set, newest first (id desc); with a column and no direction, ascending.
  string sort_by = 7;
  string sort_dir = 8;
}

message ListAccountsResponse {
  repeated Account accounts = 1;
  int64 total = 2;
}

message SetUserStatusRequest {
  string user_id = 1;
  string status = 2;
}

message SetUserStatusResponse {
  User user = 1;
}

message VerifyOtpResponse {
  Session session = 1;
}

message SuggestUsernameRequest {
  string name = 1;
  string username = 2;
  string birth_date = 3;
}

message SuggestUsernameResponse {
  repeated string usernames = 1;
}

message CheckUsernameRequest {
  string username = 1;
}

message CheckUsernameResponse {
  bool available = 1;
}

message GetUserRequest {}

message GetUserResponse {
  User user = 1;
}

message RefreshRequest {
  string refresh_token = 1;
}

message RefreshResponse {
  Session session = 1;
}

message LogoutRequest {
  string refresh_token = 1;
}

message LogoutResponse {}

message GetMemberSummaryRequest {}

message MemberLevel {
  string name = 1;
  // Empty when this is the top level.
  string next_level = 2;
  // Xp needed to reach next_level; 0 when there is none.
  int64 next_level_xp = 3;
}

message MemberSummary {
  string name = 1;
  // Unset when no levels are configured.
  MemberLevel level = 2;
  int64 points = 3;
  int64 xp = 4;
  // Vouchers that are unused and not yet expired.
  int64 voucher_count = 5;
  // Rupiah, whole.
  int64 wallet_balance = 6;
  // Customers this one referred ("Teman").
  int64 friend_count = 7;
}

message GetMemberSummaryResponse { MemberSummary summary = 1; }

message DevLoginRequest { string phone = 1; }
message DevLoginResponse { Session session = 1; }
