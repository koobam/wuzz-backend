version: "2"

run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - errorlint
    - noctx
    - revive
    - sqlclosecheck
    - rowserrcheck

  exclusions:
    rules:
      # Generated protobuf code is not ours to lint.
      - path: ^gen/
        linters: [all]
