name: Publish images

# Builds every service image for the VM (linux/amd64) and pushes it to GitHub's
# container registry, tagged with the commit. Runs on main, or by hand.
# Deploying is a separate, deliberate step: see deploy.yml.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, user, catalog, transaction, migrate]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          # ghcr.io only accepts lower-case image names.
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            SERVICE=${{ matrix.service }}
            VERSION=${{ steps.meta.outputs.short }}
          # The compose file names images ${REGISTRY}/<service>:<TAG>, with the
          # registry lower-cased (ghcr.io requires it).
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/wuzz/${{ matrix.service }}:${{ steps.meta.outputs.short }}
            ghcr.io/${{ steps.meta.outputs.owner }}/wuzz/${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
