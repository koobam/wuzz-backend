        - { name: long, in: query, schema: { type: number } }
      responses: { "200": { $ref: "#/components/responses/Ok" } }
  /app/v1/services:
    get:
      tags: [App catalog]
      summary: Services the app browses
      parameters:
        - { name: service_category, in: query, schema: { type: string } }
        - { name: selected_outlet_id, in: query, schema: { type: integer } }
        - { name: query, in: query, schema: { type: string } }
      responses: { "200": { $ref: "#/components/responses/Ok" } }
  /app/v1/banners:
    get:
      tags: [App catalog]
      summary: The banners on a phone right now
      description: "Answers { banners: [{ id, title, image_url, target_type, target_value, deeplink }] }, first shown first, at most 20. A banner is in it when it is active and the server's clock is inside its schedule. With outlet_id: those for every outlet and those limited to it; without: only those for every outlet. deeplink is wuzz://service/<id>, wuzz://outlet/<id>, wuzz://screen/<key> or an https address, and empty for a banner that goes nowhere."
      parameters:
        - { name: outlet_id, in: query, schema: { type: integer, format: int64, minimum: 1 } }
      responses: { "200": { $ref: "#/components/responses/Ok" } }
  /app/v1/vouchers:
    get:
      tags: [App catalog]
      summary: The customer's voucher wallet
      description: "Signed-in customers only (403 for staff). Answers { vouchers: [...] }: grants first (newest first), then the public vouchers. A voucher is in it when it is active, the server's clock is inside its schedule, and, for a grant, the customer's own expiry has not passed and a use is left. Each has source (public, claim or inject), uses_remaining, usage_limit and expires_at (the earlier of the voucher's end and the customer's own expiry, or null). No internal note, status or claim count."
      security: [{ bearer: [] }]
      responses: { "200": { $ref: "#/components/responses/Ok" } }
  /app/v1/vouchers/claim:
    post:
      tags: [App catalog]
      summary: Claim a voucher by its code
      description: "Body { code } (any case, spaces trimmed). Puts the voucher in the caller's own wallet and answers 201 with it. 400 for something that cannot be a code, 404 for a code that is no voucher's, 409 when the voucher is not available now (switched off, not started, ended), when the caller has it already, or when everyone it was for has claimed it. Limited to 10 attempts a minute per address."
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [code], properties: { code: { type: string } } } } }
      responses: { "201": { $ref: "#/components/responses/Ok" } }
