        - { name: q, in: query, description: "Matches, ignoring case, part of the SKU, the name or the notes", schema: { type: string, maxLength: 64 } }
        - { name: category, in: query, schema: { type: string, enum: [chemical, packaging, consumable, other] } }
        - { name: active, in: query, schema: { type: string, enum: ["true", "false"] } }
        - { name: sort_by, in: query, schema: { type: string, enum: [id, sku, name, created_at, updated_at], default: id } }
        - { name: sort_dir, in: query, schema: { type: string, enum: [asc, desc], default: asc } }
        - { name: limit, in: query, description: "Page size; 10 when left out or 0 or less, at most 100", schema: { type: integer, maximum: 100, default: 10 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses: { "200": { $ref: "#/components/responses/Ok" } }
    post:
      tags: [Backoffice]
      summary: Create a material
      description: A SKU that is already taken answers 409.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/MaterialBody" } } }
      responses: { "201": { $ref: "#/components/responses/Ok" } }
  /backoffice/v1/materials/{id}:
    get:
      tags: [Backoffice]
      security: [{ bearer: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { $ref: "#/components/responses/Ok" } }
    put:
      tags: [Backoffice]
      summary: Replace a material
      description: The unit cannot change while a recipe uses the material (409).
      security: [{ bearer: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/MaterialBody" } } }
      responses: { "200": { $ref: "#/components/responses/Ok" } }
    delete:
      tags: [Backoffice]
      summary: Delete a material
      description: "Refused with 409 naming up to five owners (a service, or \"group / option\") while any recipe uses it."
      security: [{ bearer: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { $ref: "#/components/responses/Ok" } }
  /backoffice/v1/banners:
    get:
      tags: [Backoffice]
      summary: Banners
      description: "Answers { items, total }: one page, in the carousel's order unless sorted otherwise. Each item has is_live (active, and the server's clock inside the schedule), deeplink, starts_at and ends_at (null = open), outlet_ids and outlets [{ id, name }] (empty = every outlet). Search, filter and sort run in Typesense; if it is down the answer is 503."
      security: [{ bearer: [] }]
      parameters:
        - { name: q, in: query, description: "Matches, ignoring case, part of the title or the internal note", schema: { type: string, maxLength: 64 } }
        - { name: status, in: query, schema: { type: string, enum: [active, inactive] } }
        - { name: live, in: query, description: "true = on a phone right now; false = not", schema: { type: string, enum: ["true", "false"] } }
        - { name: outlet_id, in: query, description: "banners that apply to this outlet: shown everywhere, or limited to it", schema: { type: integer, format: int64, minimum: 1 } }
        - { name: sort_by, in: query, schema: { type: string, enum: [id, title, status, sort_index, starts_at, ends_at, created_at, updated_at], default: sort_index } }
        - { name: sort_dir, in: query, schema: { type: string, enum: [asc, desc], default: asc } }
        - { name: limit, in: query, description: "Page size; 10 when left out or 0 or less, at most 100", schema: { type: integer, maximum: 100, default: 10 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses: { "200": { $ref: "#/components/responses/Ok" } }
    post:
      tags: [Backoffice]
      summary: Create a banner
      description: "It takes the last place in the carousel. 400 when a rule is broken (no title, active without an image, a target that is missing or does not exist, a schedule that ends before it starts, an outlet that does not exist)."
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/BannerBody" } } }
      responses: { "201": { $ref: "#/components/responses/Ok" } }
  /backoffice/v1/banners/screens:
    get:
      tags: [Backoffice]
      summary: The screens of the app a banner may open
      description: "Answers { screens: [key, ...] }: the values target_value may take when target_type is screen."
      security: [{ bearer: [] }]
      responses: { "200": { $ref: "#/components/responses/Ok" } }
  /backoffice/v1/banners/reorder:
    post:
      tags: [Backoffice]
      summary: Set the carousel's order
      description: "ids must list every banner exactly once (400 otherwise). Answers { items, total } in the new order (the first 100)."
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/BannerOrder" } } }
      responses: { "200": { $ref: "#/components/responses/Ok" } }
  /backoffice/v1/banners/{id}:
    get:
      tags: [Backoffice]
      security: [{ bearer: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { $ref: "#/components/responses/Ok" } }
    put:
      tags: [Backoffice]
      summary: Replace a banner
      description: "Everything but its place in the carousel, which only the reorder call changes."
      security: [{ bearer: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/BannerBody" } } }
      responses: { "200": { $ref: "#/components/responses/Ok" } }
    patch:
      tags: [Backoffice]
      summary: Switch a banner on or off
      description: "Body { status }. Switching one on that has no image answers 400."
      security: [{ bearer: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [status], properties: { status: { type: string, enum: [active, inactive] } } } } }
      responses: { "200": { $ref: "#/components/responses/Ok" } }
    delete:
      tags: [Backoffice]
      summary: Delete a banner
      security: [{ bearer: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { $ref: "#/components/responses/Ok" } }
  /backoffice/v1/vouchers:
    get:
      tags: [Backoffice]
      summary: Vouchers
      description: "Answers { items, total }: one page, newest first unless sorted otherwise. Each item has type (public or code), is_live (active, and the server's clock inside the schedule), claims_count (how many customers hold it), starts_at and ends_at (null = open), outlet_ids and outlets [{ id, name }] and service_ids and services [{ id, name }] (empty = everywhere). Search, filter and sort run in Typesense; if it is down the answer is 503."
      security: [{ bearer: [] }]
      parameters:
        - { name: q, in: query, description: "Matches, ignoring case, part of the title, the code, the description or the internal note", schema: { type: string, maxLength: 64 } }
        - { name: status, in: query, schema: { type: string, enum: [active, inactive] } }
        - { name: live, in: query, description: "true = usable right now; false = not", schema: { type: string, enum: ["true", "false"] } }
        - { name: period, in: query, description: "where the schedule stands against the clock, whatever the status", schema: { type: string, enum: [running, upcoming, ended, unlimited] } }
        - { name: discount_type, in: query, schema: { type: string, enum: [percentage, amount] } }
        - { name: outlet_id, in: query, description: "vouchers usable at this outlet: everywhere, or limited to it", schema: { type: integer, format: int64, minimum: 1 } }
        - { name: sort_by, in: query, schema: { type: string, enum: [id, title, code, status, value, claims, starts_at, ends_at, created_at, updated_at], default: created_at } }
        - { name: sort_dir, in: query, schema: { type: string, enum: [asc, desc], default: desc } }
        - { name: limit, in: query, description: "Page size; 10 when left out or 0 or less, at most 100", schema: { type: integer, maximum: 100, default: 10 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses: { "200": { $ref: "#/components/responses/Ok" } }
    post:
      tags: [Backoffice]
      summary: Create a voucher
      description: "400 when a rule is broken (no title, a percentage outside 1 to 100, a cap on an amount, a claim limit without a code, a colour outside the set, a schedule that ends before it starts, an outlet or service that does not exist); 409 when the code is taken."
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/VoucherBody" } } }
      responses: { "201": { $ref: "#/components/responses/Ok" } }
  /backoffice/v1/vouchers/colors:
    get:
      tags: [Backoffice]
      summary: The colours a coupon may have
      description: "Answers { colors: [\"#RRGGBB\", ...] }; the first is the default."
      security: [{ bearer: [] }]
      responses: { "200": { $ref: "#/components/responses/Ok" } }
  /backoffice/v1/vouchers/{id}:
    get:
      tags: [Backoffice]
      security: [{ bearer: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { $ref: "#/components/responses/Ok" } }
    put:
      tags: [Backoffice]
      summary: Replace a voucher
      description: "While customers hold the voucher its code cannot change and its claim limit cannot go below their number (409); everything else can, and what they hold follows."
      security: [{ bearer: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/VoucherBody" } } }
      responses: { "200": { $ref: "#/components/responses/Ok" } }
    patch:
      tags: [Backoffice]
      summary: Switch a voucher on or off
      description: "Body { status }. A voucher that is switched off leaves every wallet; the copies customers hold are kept."
      security: [{ bearer: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [status], properties: { status: { type: string, enum: [active, inactive] } } } } }
      responses: { "200": { $ref: "#/components/responses/Ok" } }
    delete:
      tags: [Backoffice]
      summary: Delete a voucher
      description: "Refused with 409 while any customer holds it; switch it off instead. Answers { id, title }."
      security: [{ bearer: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { $ref: "#/components/responses/Ok" } }
  /backoffice/v1/vouchers/{id}/grants:
    get:
      tags: [Backoffice]
      summary: Who holds a voucher
      description: "Answers { items, total }, newest first. Each has customer_id, customer_name and customer_phone (as they were when it was granted), source (claim or inject), granted_by (the admin who sent it; empty for a claim), granted_at, expires_at (null = until the voucher ends) and uses_remaining."
      security: [{ bearer: [] }]
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { name: q, in: query, description: "part of the customer's name or phone number", schema: { type: string, maxLength: 64 } }
        - { name: limit, in: query, schema: { type: integer, maximum: 100, default: 10 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses: { "200": { $ref: "#/components/responses/Ok" } }
  /backoffice/v1/vouchers/{id}/inject:
    post:
      tags: [Backoffice]
      summary: Put a voucher in customers' wallets
      description: "Names customers by id and by phone number, at most 500 in all; a customer named twice counts once. Each customer found gets one copy, with usage_limit uses, unless they hold it already, the voucher's claim limit has been reached, or they are switched off or banned. Answers the audit of the send: target_count, injected_count and skipped { already_held, over_limit, not_found, inactive }, which add up to target_count. Only a voucher with a code that is switched on and has not ended can be sent (409 otherwise). Sending again is safe: nobody gets a second copy."
      security: [{ bearer: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/VoucherInject" } } }
      responses: { "200": { $ref: "#/components/responses/Ok" } }
  /backoffice/v1/voucher-injections:
    get:
      tags: [Backoffice]
      summary: The audit of voucher sends
      description: "Answers { items, total }, newest first: who sent which voucher (title and code as they were), to how many, and what became of the rest."
      security: [{ bearer: [] }]
      parameters:
        - { name: voucher_id, in: query, description: "only the sends of this voucher", schema: { type: integer, format: int64, minimum: 1 } }
        - { name: limit, in: query, schema: { type: integer, maximum: 100, default: 10 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses: { "200": { $ref: "#/components/responses/Ok" } }
  /backoffice/v1/boms/{owner_type}/{owner_id}:
    get:
      tags: [Backoffice]
      summary: A recipe (bill of materials)
      description: |
        The materials a service, a variant option or a modifier option consumes. `cost` is the exact cost of the per-unit lines for one unit sold and
        `line_cost` that of the per-line lines (once per order line), each rounded half away from zero to 6 places for display only.
      security: [{ bearer: [] }]
      parameters:
        - { name: owner_type, in: path, required: true, schema: { type: string, enum: [service, variant_option, modifier_option] } }
        - { name: owner_id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses: { "200": { $ref: "#/components/responses/Ok" } }
    put:
      tags: [Backoffice]
      summary: Replace a recipe
      description: A material that is inactive may stay on a line it is already on but cannot be newly added.
      security: [{ bearer: [] }]
      parameters:
        - { name: owner_type, in: path, required: true, schema: { type: string, enum: [service, variant_option, modifier_option] } }
        - { name: owner_id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/BomBody" } } }
      responses: { "200": { $ref: "#/components/responses/Ok" } }
  /backoffice/v1/services/{id}/costing:
    get:
      tags: [Backoffice]
      summary: The cost table of a service
      description: |
        What the service's own recipe costs and what the recipe of each ACTIVE option of its linked variant and modifier groups adds, per unit sold and per
        order line. Values are decimal strings rounded half away from zero to 6 places for display only.
      security: [{ bearer: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { $ref: "#/components/responses/Ok" } }
  /backoffice/v1/costing/calc:
    post:
      tags: [Backoffice]
      summary: Cost a sale exactly
      description: |
        Every material line is an exact fraction; they are added and rounded to whole rupiah ONCE, half away from zero. `unit_price` is the service price
        plus the chosen variants' extras plus the chosen modifiers' prices; `revenue` is unit_price x qty rounded once; `margin_percent` is gross_profit / revenue x 100
        rounded to 2 places (0.00 without revenue). A variant group with no option chosen takes its default option; modifier choices respect the group's min and max.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CostingCalcBody" } } }
      responses: { "200": { $ref: "#/components/responses/Ok" } }
  /backoffice/v1/stock:
    get:
      tags: [Backoffice]
      summary: Stock on hand
      description: |
        One row per outlet and material: the quantity (an exact decimal string, may be negative after sales), what it is worth in whole rupiah, and the average cost
        (value / qty, an exact fraction shown rounded half away from zero to 6 places; the material's standard unit cost while nothing is on hand).
        With an outlet, every active material is listed, with 0 when it has no balance yet, so receiving can start from the list. Answers { items, total }.
      security: [{ bearer: [] }]
      parameters:
        - { name: outlet_id, in: query, description: "Which outlet; left out lists every outlet", schema: { type: integer, format: int64 } }
        - { name: q, in: query, description: "Part of the SKU or the name, ignoring case", schema: { type: string, maxLength: 64 } }
        - { name: low, in: query, description: "true = only what has reached its reorder level (min_qty > 0 and qty <= min_qty)", schema: { type: boolean } }
        - { name: sort_by, in: query, schema: { type: string, enum: [sku, name, qty, value], default: sku } }
        - { name: sort_dir, in: query, schema: { type: string, enum: [asc, desc], default: asc } }
        - { name: limit, in: query, description: "Page size; 10 when left out or 0 or less, at most 100", schema: { type: integer, maximum: 100, default: 10 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses: { "200": { $ref: "#/components/responses/Ok" } }
  /backoffice/v1/stock/movements:
    get:
      tags: [Backoffice]
      summary: The stock ledger
      description: |
        Every movement, newest first by default. A movement carries the balance after it, so the ledger can be audited on its own: a balance's value is the
        sum of its value_deltas. A movement made from an order carries ref_id (the order's id) and ref_code (its TRX code, e.g. TRX-25102026-K7M2, as it was when the movement was written; "" for other movements and for those from before codes existed). Answers { items, total }.
      security: [{ bearer: [] }]
      parameters:
        - { name: outlet_id, in: query, description: "Which outlet; left out lists every outlet", schema: { type: integer, format: int64 } }
        - { name: material_id, in: query, schema: { type: integer, format: int64 } }
        - { name: kind, in: query, schema: { type: string, enum: [receipt, consumption, consumption_reversal, waste, adjustment, transfer_in, transfer_out] } }
        - { name: q, in: query, description: "Part of the note, the document number, the supplier or the order's TRX code (ref_code), ignoring case", schema: { type: string, maxLength: 64 } }
        - { name: from, in: query, description: "First day, YYYY-MM-DD (Asia/Jakarta)", schema: { type: string, format: date } }
        - { name: to, in: query, description: "Last day, included", schema: { type: string, format: date } }
        - { name: sort_by, in: query, schema: { type: string, enum: [created_at, id], default: created_at } }
        - { name: sort_dir, in: query, schema: { type: string, enum: [asc, desc], default: desc } }
        - { name: limit, in: query, description: "Page size; 10 when left out or 0 or less, at most 100", schema: { type: integer, maximum: 100, default: 10 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses: { "200": { $ref: "#/components/responses/Ok" } }
  /backoffice/v1/stock/receipts:
    post:
      tags: [Backoffice]
      summary: Receive goods
      description: |
        Books goods received; the value is the total cost paid, as entered. 201 for a new movement, 200 when the idempotency_key had already been used and the
        original movement is returned.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/StockReceiptBody" } } }
      responses: { "201": { $ref: "#/components/responses/Ok" } }
  /backoffice/v1/stock/waste:
    post:
      tags: [Backoffice]
      summary: Write stock off
      description: |
        Takes stock out as expired, damaged, spilled, lost or other, valued at the moving average. More than is on hand is refused with 400 "Only X unit in stock".
        201 for a new movement, 200 for a retried key.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/StockWasteBody" } } }
      responses: { "201": { $ref: "#/components/responses/Ok" } }
  /backoffice/v1/stock/adjustments:
    post:
      tags: [Backoffice]
      summary: Book a stock count
      description: |
        Books the difference between the counted quantity and the book (a positive one is valued at the current average, a negative one like waste). When they are equal
        nothing is booked and the answer is 200 with data null.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/StockAdjustBody" } } }
      responses: { "201": { $ref: "#/components/responses/Ok" } }
  /backoffice/v1/stock/transfers:
    post:
      tags: [Backoffice]
      summary: Move stock between outlets
      description: Two movements with the same ref in one transaction (transfer_out, then transfer_in worth exactly what left). Answers { out, in }; 201 new, 200 retried key.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/StockTransferBody" } } }
      responses: { "201": { $ref: "#/components/responses/Ok" } }
  /backoffice/v1/stock/min:
    put:
      tags: [Backoffice]
      summary: Set a reorder level
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/StockMinBody" } } }
      responses: { "200": { $ref: "#/components/responses/Ok" } }
  /backoffice/v1/orders:
    get:
      tags: [Backoffice]
      security: [{ bearer: [] }]
      parameters:
        - { name: outlet_id, in: query, schema: { type: integer } }
        - { name: status, in: query, schema: { type: string } }
        - { name: sort_by, in: query, schema: { type: string, enum: [created_at, total, status, customer_name, outlet_id, id, code] } }
        - { name: sort_dir, in: query, schema: { type: string, enum: [asc, desc], default: desc } }
        - { name: q, in: query, description: "Part of the transaction code (TRX-25102026-K7M2), the start of the order id, or part of the customer name or phone, ignoring case", schema: { type: string, maxLength: 64 } }
        - { name: from, in: query, description: "First day, YYYY-MM-DD (Asia/Jakarta, by when the order was created); either end may be left out; at most 366 days apart", schema: { type: string, format: date } }
        - { name: to, in: query, description: "Last day, included", schema: { type: string, format: date } }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses: { "200": { $ref: "#/components/responses/Ok" } }
  /backoffice/v1/orders/summary:
    get:
      tags: [Backoffice]
      summary: Totals for the Orders page
      description: |
        Counts and sums over the orders that GET /backoffice/v1/orders would list under the same filters (they share one WHERE clause), for the page's cards.
        The cards follow the filters exactly and no status is special: `orders` counts every matching order and `counted` is the same number (kept for
        compatibility); `value` (whole rupiah) and `lines` (order lines) are summed over all of them, cancelled ones included (so with status=cancelled the value is
        the cancelled orders' value). `open` is created + processing + ready. `avg_value` is value / orders, rounded once half away from zero (0 when there are none);
        `avg_lines` is lines / orders with 2 decimal places; `cancelled_percent` and `fulfilled_percent` are the share of `orders` with 1 decimal place ("0.0" when
        there are no orders). All of it is integer arithmetic, rounded once at the end; no floating point is involved.
      security: [{ bearer: [] }]
      parameters:
        - { name: outlet_id, in: query, schema: { type: integer, format: int64 } }
        - { name: status, in: query, schema: { type: string, enum: [created, processing, ready, fulfilled, cancelled] } }
        - { name: q, in: query, description: "Part of the transaction code (TRX-25102026-K7M2), the start of the order id, or part of the customer name or phone, ignoring case", schema: { type: string, maxLength: 64 } }
        - { name: from, in: query, description: "First day, YYYY-MM-DD (Asia/Jakarta); at most 366 days from `to`", schema: { type: string, format: date } }
        - { name: to, in: query, description: "Last day, included", schema: { type: string, format: date } }
      responses: { "200": { $ref: "#/components/responses/Ok" } }
  /backoffice/v1/stats/orders:
    get:
      tags: [Backoffice]
      summary: Dashboard numbers
      description: For the orders created within a range (Asia/Jakarta), their count by status, the revenue of the fulfilled ones, and a row per day. The range is the last `days` days, or `from`..`to` (both, YYYY-MM-DD, at most 92 days).
      security: [{ bearer: [] }]
      parameters:
        - { name: outlet_id, in: query, schema: { type: integer } }
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 92, default: 7 } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses: { "200": { $ref: "#/components/responses/Ok" } }
  /backoffice/v1/presence:
    get:
      tags: [Backoffice]
      summary: Staff online now
      description: Everyone who pinged in the last 45 seconds, by name.
      security: [{ bearer: [] }]
      responses: { "200": { $ref: "#/components/responses/Ok" } }
  /backoffice/v1/presence/ping:
    post:
      tags: [Backoffice]
      summary: Mark the caller online
      description: Apps call this every 20 seconds while open.
      security: [{ bearer: [] }]
      responses: { "200": { $ref: "#/components/responses/Ok" } }
  /pos/v1/stock:
    get:
      tags: [POS]
      summary: Stock on hand
      description: |
        One row per outlet and material: the quantity (an exact decimal string, may be negative after sales), what it is worth in whole rupiah, and the average cost
        (value / qty, an exact fraction shown rounded half away from zero to 6 places; the material's standard unit cost while nothing is on hand).
        With an outlet, every active material is listed, with 0 when it has no balance yet, so receiving can start from the list. Answers { items, total }.
      security: [{ bearer: [] }]
      parameters:
        - { name: outlet_id, in: query, description: "Ignored: the list is always the outlet the signed-in account is pinned to", schema: { type: integer, format: int64 } }
        - { name: q, in: query, description: "Part of the SKU or the name, ignoring case", schema: { type: string, maxLength: 64 } }
        - { name: low, in: query, description: "true = only what has reached its reorder level (min_qty > 0 and qty <= min_qty)", schema: { type: boolean } }
        - { name: sort_by, in: query, schema: { type: string, enum: [sku, name, qty, value], default: sku } }
        - { name: sort_dir, in: query, schema: { type: string, enum: [asc, desc], default: asc } }
        - { name: limit, in: query, description: "Page size; 10 when left out or 0 or less, at most 100", schema: { type: integer, maximum: 100, default: 10 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses: { "200": { $ref: "#/components/responses/Ok" } }
  /pos/v1/stock/movements:
    get:
      tags: [POS]
      summary: The stock ledger
      description: |
        Every movement, newest first by default. A movement carries the balance after it, so the ledger can be audited on its own: a balance's value is the
        sum of its value_deltas. A movement made from an order carries ref_id (the order's id) and ref_code (its TRX code, e.g. TRX-25102026-K7M2, as it was when the movement was written; "" for other movements and for those from before codes existed). Answers { items, total }.
      security: [{ bearer: [] }]
      parameters:
        - { name: outlet_id, in: query, description: "Ignored: the list is always the outlet the signed-in account is pinned to", schema: { type: integer, format: int64 } }
        - { name: material_id, in: query, schema: { type: integer, format: int64 } }
        - { name: kind, in: query, schema: { type: string, enum: [receipt, consumption, consumption_reversal, waste, adjustment, transfer_in, transfer_out] } }
        - { name: q, in: query, description: "Part of the note, the document number, the supplier or the order's TRX code (ref_code), ignoring case", schema: { type: string, maxLength: 64 } }
        - { name: from, in: query, description: "First day, YYYY-MM-DD (Asia/Jakarta)", schema: { type: string, format: date } }
        - { name: to, in: query, description: "Last day, included", schema: { type: string, format: date } }
        - { name: sort_by, in: query, schema: { type: string, enum: [created_at, id], default: created_at } }
        - { name: sort_dir, in: query, schema: { type: string, enum: [asc, desc], default: desc } }
        - { name: limit, in: query, description: "Page size; 10 when left out or 0 or less, at most 100", schema: { type: integer, maximum: 100, default: 10 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses: { "200": { $ref: "#/components/responses/Ok" } }
  /pos/v1/stock/receipts:
    post:
      tags: [POS]
      summary: Receive goods
      description: |
        Books goods received; the value is the total cost paid, as entered. 201 for a new movement, 200 when the idempotency_key had already been used and the
        original movement is returned. The outlet is always the account's own.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/StockReceiptBody" } } }
      responses: { "201": { $ref: "#/components/responses/Ok" } }
  /pos/v1/stock/waste:
    post:
      tags: [POS]
      summary: Write stock off
      description: |
        Takes stock out as expired, damaged, spilled, lost or other, valued at the moving average. More than is on hand is refused with 400 "Only X unit in stock".
        201 for a new movement, 200 for a retried key. The outlet is always the account's own.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/StockWasteBody" } } }
      responses: { "201": { $ref: "#/components/responses/Ok" } }
  /pos/v1/stock/adjustments:
    post:
      tags: [POS]
      summary: Not for the POS
      description: Head office only; always answers 403.
      security: [{ bearer: [] }]
      responses: { "403": { $ref: "#/components/responses/Ok" } }
  /pos/v1/stock/transfers:
    post:
      tags: [POS]
      summary: Not for the POS
      description: Head office only; always answers 403.
      security: [{ bearer: [] }]
      responses: { "403": { $ref: "#/components/responses/Ok" } }
  /pos/v1/stock/min:
    put:
      tags: [POS]
      summary: Not for the POS
      description: Head office only; always answers 403.
      security: [{ bearer: [] }]
      responses: { "403": { $ref: "#/components/responses/Ok" } }
  /pos/v1/presence/ping:
    post:
      tags: [POS]
      summary: Mark the caller online
      description: The POS calls this every 20 seconds while open, so the back office can see who is working.
      security: [{ bearer: [] }]
      responses: { "200": { $ref: "#/components/responses/Ok" } }
  /backoffice/v1/orders/{id}:
    get:
      tags: [Backoffice]
      security: [{ bearer: [] }]
      parameters: [{ $ref: "#/components/parameters/OrderId" }]
      responses: { "200": { $ref: "#/components/responses/Ok" } }
  /backoffice/v1/orders/{id}/status:
    patch:
      tags: [Backoffice]
      security: [{ bearer: [] }]
      parameters: [{ $ref: "#/components/parameters/OrderId" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/OrderStatus" } } }
      responses: { "200": { $ref: "#/components/responses/Ok" } }
