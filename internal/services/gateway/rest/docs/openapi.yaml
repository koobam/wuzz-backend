  /backoffice/v1/tax:
    get:
      tags: [Backoffice]
      summary: The rate of each tax type
      description: |
        { types: [{ type, rate_bps }] }: "none" is 0 and "ppn" is 1100 (11%). A service stores its price before tax and its tax type; the price after tax is
        price + tax, with tax = price x rate_bps / 10000 rounded ONCE to whole rupiah, half away from zero (10.000 at 11% is 11.100; 50 at 11% is 56).
        Every service answered by the API already carries price_before_tax (the list price), discount_type, discount_value, discount_amount, price_after_discount (what tax is added to), tax_rate_bps and price_after_tax; this is for a form that previews them while typing.
      security: [{ bearer: [] }]
      responses: { "200": { $ref: "#/components/responses/Ok" } }
  /backoffice/v1/service-categories:
    get:
      tags: [Backoffice]
      summary: The categories services are listed under
      security: [{ bearer: [] }]
      responses: { "200": { $ref: "#/components/responses/Ok" } }
  /backoffice/v1/uploads:
    post:
      tags: [Backoffice]
      summary: Upload a picture
      description: |
        Send one JPEG, PNG, WebP or AVIF picture as multipart/form-data in the field `file` (at most 5 MB, 8000 pixels on a side, 25 megapixels;
        the type is decided by the bytes, never by the file name or the declared type). JPEG and PNG are re-encoded without their metadata;
        WebP and AVIF are stored as sent. `folder` is optional and must be one of: outlets (the default), banners, vouchers. The answer is the address the
        picture is now served from (`url`) and its random `key`; put the `url` in an outlet's `images`.
        413 when over the size limit, 415 when it is not one of the four types, 400 for a damaged or oversized picture, 503 when uploads
        are not configured or the store is down.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                folder: { type: string, enum: [outlets, banners, vouchers], default: outlets }
      responses:
        "201":
          description: The stored picture, in the envelope's `data`
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data: { $ref: "#/components/schemas/Upload" }
        "400": { $ref: "#/components/responses/Ok" }
        "413": { $ref: "#/components/responses/Ok" }
        "415": { $ref: "#/components/responses/Ok" }
        "503": { $ref: "#/components/responses/Ok" }
  /backoffice/v1/outlets:
    get:
      tags: [Backoffice]
      summary: Outlets, optionally only those inside a map area
      description: Give all of south, west, north and east (degrees) to get only the outlets inside that box, or none for every outlet.
      security: [{ bearer: [] }]
      parameters:
        - { name: south, in: query, schema: { type: number, minimum: -90, maximum: 90 } }
        - { name: west, in: query, schema: { type: number, minimum: -180, maximum: 180 } }
        - { name: north, in: query, schema: { type: number, minimum: -90, maximum: 90 } }
        - { name: east, in: query, schema: { type: number, minimum: -180, maximum: 180 } }
      responses: { "200": { $ref: "#/components/responses/Ok" } }
    post:
      tags: [Backoffice]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/OutletBody" } } }
      responses: { "200": { $ref: "#/components/responses/Ok" } }
  /backoffice/v1/outlets/{id}:
    patch:
      tags: [Backoffice]
      security: [{ bearer: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/OutletBody" } } }
      responses: { "200": { $ref: "#/components/responses/Ok" } }
    delete:
      tags: [Backoffice]
      summary: Delete an outlet
      description: "Removes the outlet and its opening hours. Refused with 409 naming what is left (staff or admin accounts, orders) while anything points at it, while it has stock records, and while a banner opens it or is limited to it, and while a voucher is limited to it; switch it off (active=false) instead. 404 for an unknown id. Its pictures stay in the media storage."
      security: [{ bearer: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { $ref: "#/components/responses/Ok" } }
  /backoffice/v1/services:
    get:
