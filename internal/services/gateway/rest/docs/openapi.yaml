openapi: 3.0.3
info:
  title: Wuzz API
  version: "1.0"
  description: |
    Public REST edge of Wuzz. Every response uses one envelope:
    `{ "success": bool, "message": str, "data": ... }`.

    Sign in with phone + one-time code. On staging the code is written to the `user`
    service log, not sent by SMS. Send the access token as `Authorization: Bearer <token>`.
servers:
  - url: https://api-stg.wuzz.care
tags:
  - name: App auth
  - name: App catalog
  - name: Staff auth
  - name: POS
  - name: Station
  - name: Backoffice
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    OrderId:
      name: id
      in: path
      required: true
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, default: 25 }
    Offset:
      name: offset
      in: query
      schema: { type: integer, default: 0 }
  schemas:
    Envelope:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        data: {}
    Upload:
      type: object
      properties:
        url: { type: string, example: "https://assets.wuzz.care/outlets/2026/10/3f9c1b7a5d2e4c8f9a0b1c2d3e4f5a6b.webp" }
        key: { type: string, example: "outlets/2026/10/3f9c1b7a5d2e4c8f9a0b1c2d3e4f5a6b.webp" }
        file_name: { type: string, description: "The name the file had on the sender's side, for display only", example: "pusat-depan.jpg" }
        content_type: { type: string, enum: [image/jpeg, image/png, image/webp, image/avif] }
        size: { type: integer, description: Bytes as stored }
        width: { type: integer }
        height: { type: integer }
    Phone:
      type: object
      required: [phone]
      properties:
        phone: { type: string, example: "081234500099" }
    Verify:
      type: object
      required: [phone, otp_code]
      properties:
        phone: { type: string, example: "081234500099" }
        otp_code: { type: string, example: "123456" }
    Register:
      type: object
      required: [username, name, phone]
      properties:
        username: { type: string }
        name: { type: string }
        date_of_birth: { type: string, example: "1998-04-21" }
        phone: { type: string }
        email: { type: string }
    AppRefresh:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }
    StaffRefresh:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string }
    OutletBody:
      type: object
      required: [name]
      properties:
        name: { type: string }
        address: { type: string }
        phone: { type: string, example: "0211234567", description: "required on a create (digits, spaces, + - ( ), 6 to 20 characters); a full edit cannot blank it" }
        email: { type: string, format: email, maxLength: 254, example: "pusat@wuzz.care", description: "the outlet's contact email, stored lower-case; required on a create; leave out to keep the stored one; a full edit cannot blank it. The on/off switch (a PATCH that changes only `active`) is exempt, so an outlet seeded without an email can still be switched" }
        latitude: { type: number }
        longitude: { type: number }
        active: { type: boolean }
        images: { type: array, items: { type: string }, description: "https addresses of the outlet's pictures, the first is its banner; leave out to keep them, [] to remove them" }
        category: { type: string, enum: [laundry, caffe, all], description: "what the outlet is for; required on a create; leave out to keep the stored one" }
        delivery_types: { type: array, items: { type: string, enum: [pickup, delivery] }, minItems: 1, description: "how an order reaches the customer; leave out to keep them (a new outlet has both)" }
        open_time: { type: string, example: "08:00", pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', description: "older, single-range form: with close_time and WITHOUT hours it sets one range for all seven days (24 hour HH:MM, 00:00 to 23:59); a side left out is taken from the first open day. Ignored when hours is sent" }
        close_time: { type: string, example: "22:00", pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', description: "closing time, same format; a close before the open means the outlet closes after midnight (22:00-02:00); it cannot equal open_time" }
        timezone: { type: string, enum: [Asia/Jakarta, Asia/Makassar, Asia/Jayapura], description: "the clock the hours are on: WIB, WITA or WIT; leave out to keep it (a new outlet is Asia/Jakarta)" }
        hours: { type: array, minItems: 7, maxItems: 7, items: { $ref: '#/components/schemas/OutletDay' }, description: "exactly seven days, weekday 0 (Monday) to 6 (Sunday), each once, in any order; leave out to keep the stored week (a new outlet is open 08:00-22:00 every day, or open_time-close_time if those are sent)" }
    OutletDay:
      type: object
      required: [weekday]
      properties:
        weekday: { type: integer, minimum: 0, maximum: 6, description: "0 = Monday ... 6 = Sunday" }
        closed: { type: boolean, description: "a closed day has no times (any sent are ignored)" }
        open_24h: { type: boolean, description: "open round the clock (the whole local day, 00:00 to 24:00): the day has no times of its own, any sent are ignored, and it is read back with open_time and close_time \"00:00\". It cannot be sent together with closed (400). Today's range (the outlet's top-level open_time/close_time) reads 00:00-23:59 on such a day" }
        open_time: { type: string, example: "08:00", pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        close_time: { type: string, example: "22:00", pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', description: "a close before the open means the outlet closes after midnight, in the early hours of the NEXT day; it cannot equal open_time" }
    Outlet:
      type: object
      description: "An outlet as the back office reads it (the body fields above, plus what the server works out)"
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        address: { type: string }
        phone: { type: string }
        email: { type: string, description: "the outlet's contact email, lower-case; empty when it has none" }
        latitude: { type: number }
        longitude: { type: number }
        active: { type: boolean }
        images: { type: array, items: { type: string } }
        category: { type: string, enum: [laundry, caffe, all] }
        delivery_types: { type: array, items: { type: string, enum: [pickup, delivery] } }
        open_time: { type: string, example: "08:00", description: "TODAY's opening time on the outlet's clock (empty when it is closed today); kept for older clients, use hours" }
        close_time: { type: string, example: "22:00", description: "TODAY's closing time (empty when closed today)" }
        timezone: { type: string, enum: [Asia/Jakarta, Asia/Makassar, Asia/Jayapura] }
        timezone_label: { type: string, enum: [WIB, WITA, WIT] }
        hours: { type: array, items: { $ref: '#/components/schemas/OutletDay' }, description: "the week, Monday (weekday 0) to Sunday (6), always seven days" }
        is_open_now: { type: boolean, description: "whether the week says the outlet is open at the moment of the request, on the outlet's own clock: today's hours, or yesterday's if they run past midnight and are still going (the closing minute itself is closed)" }
    ServiceBody:
      type: object
      required: [name, unit]
      properties:
        name: { type: string }
        unit: { type: string, example: kg }
        price_before_tax: { type: integer, format: int64, minimum: 0, description: "whole rupiah BEFORE tax: what is stored and keyed in. On an update, leave out to keep it" }
        price: { type: integer, format: int64, description: "the older name of price_before_tax, accepted only for a service without tax (where they are the same number): a price read back from the list is the one AFTER tax" }
        tax_type: { type: string, enum: [none, ppn], description: "how tax is added to the price. A create without it is none; an update without it keeps the stored one" }
        discount_type: { type: string, enum: [none, value, percent], description: "a discount on the list price (price_before_tax), taken off BEFORE tax. A create without it is none; an update without it keeps the stored one" }
        discount_value: { type: integer, format: int64, minimum: 0, description: "the size of the discount: whole rupiah for value (at most the price), basis points for percent (1250 = 12.5%, at most 10000). Must be 0 for none; an update that gives discount_type none without it clears it" }
        internal_notes: { type: string, maxLength: 500, description: "a note for staff, never shown to customers; an update without it keeps the stored note" }
        active: { type: boolean }
        category_id: { type: integer, format: int64, description: "the category it is listed under; leave out to keep it, 0 for none" }
        variant_group_ids: { type: array, maxItems: 20, items: { type: integer, format: int64 }, description: "the variant groups the service offers, in order; leave out to keep them, [] to remove them all" }
        modifier_group_ids: { type: array, maxItems: 20, items: { type: integer, format: int64 }, description: "the modifier groups the service carries, in order; leave out to keep them, [] to remove them all" }
    VariantGroupBody:
      type: object
      required: [name, options]
      description: A choice of exactly one option, shared by the services that offer it. Each option adds its price_delta to the service's price. The first active option becomes the default when none is marked.
      properties:
        name: { type: string, maxLength: 80 }
        internal_notes: { type: string, maxLength: 500, description: "a private note for the back office; the names of groups need not be unique, this tells them apart" }
        options:
          type: array
          minItems: 1
          maxItems: 30
          description: "A PUT replaces the options: those with an id are kept, the ones left out are deleted, the ones without an id are added."
          items:
            type: object
            required: [name]
            properties:
              id: { type: integer, format: int64, description: "leave out for a new option" }
              name: { type: string, maxLength: 80 }
              price_delta: { type: integer, format: int64, minimum: 0 }
              is_default: { type: boolean }
              active: { type: boolean, default: true }
              estimated_time: { type: integer, minimum: 0 }
              estimated_time_unit: { type: string }
    ModifierGroupBody:
      type: object
      required: [name, options]
      description: Optional add-ons with a rule for how many may be picked. Names are unique, ignoring case.
      properties:
        name: { type: string, maxLength: 80 }
        internal_notes: { type: string, maxLength: 500 }
        min: { type: integer, minimum: 0, description: "0 is optional, 1 or more is required; at most the number of active options" }
        max: { type: integer, minimum: 1, nullable: true, description: "the most that may be picked, not below min; null or left out for no limit" }
        options:
          type: array
          minItems: 1
          maxItems: 30
          description: "A PUT replaces the options the same way as for a variant group."
          items:
            type: object
            required: [name]
            properties:
              id: { type: integer, format: int64 }
              name: { type: string, maxLength: 80 }
              description: { type: string }
              price: { type: integer, format: int64, minimum: 0, description: "added per unit; 0 is free" }
              active: { type: boolean, default: true }
    MaterialBody:
      type: object
      required: [sku, name, category, unit, purchase_price, purchase_qty]
      description: |
        A material (bahan). All quantities of a recipe are in its base unit. What one base unit costs is the exact fraction purchase_price / purchase_qty
        (Rp 100.000 for 3.000 ml is 100/3 per ml); it is derived whenever needed, never stored or rounded. The `unit_cost` of a response is that fraction
        rounded half away from zero to 6 places, for display only.
      properties:
        sku: { type: string, minLength: 1, maxLength: 40, pattern: "^[A-Za-z0-9._/-]+$", description: "unique ignoring case" }
        name: { type: string, maxLength: 80 }
        category: { type: string, enum: [chemical, packaging, consumable, other] }
        unit: { type: string, enum: [ml, g, pcs, sheet], description: "the base unit; it cannot change while a recipe uses the material" }
        purchase_price: { type: integer, format: int64, minimum: 0, description: "whole rupiah" }
        purchase_qty: { type: string, example: "3000", description: "how many base units that price buys: an exact decimal STRING, more than 0, at most 4 decimal places (a JSON number is refused)" }
        active: { type: boolean, default: true }
        notes: { type: string, maxLength: 500 }
    BomBody:
      type: object
      required: [lines]
      description: Replaces the whole recipe of the owner. At most 40 lines, one per material.
      properties:
        lines:
          type: array
          maxItems: 40
          items:
            type: object
            required: [material_id, qty, per]
            properties:
              material_id: { type: integer, format: int64 }
              qty: { type: string, example: "25", description: "base units, an exact decimal STRING, more than 0, at most 4 decimal places" }
              per: { type: string, enum: [unit, line], description: "unit = for every unit sold (per kg, pcs, session), scales with the quantity; line = once per order line" }
              loss_percent: { type: string, example: "5", description: "standard waste, an exact decimal STRING from 0 to 100 with at most 2 decimal places; the effective quantity is qty x (1 + loss_percent / 100)" }
    CostingCalcBody:
      type: object
      required: [service_id, qty]
      properties:
        service_id: { type: integer, format: int64 }
        variant_option_ids: { type: array, items: { type: integer, format: int64 } }
        modifier_option_ids: { type: array, items: { type: integer, format: int64 } }
        qty: { type: string, example: "2.5", description: "units sold, an exact decimal STRING, more than 0, at most 4 decimal places" }
    StockReceiptBody:
      type: object
      required: [outlet_id, material_id, qty, total_cost]
      properties:
        outlet_id: { type: integer, format: int64 }
        material_id: { type: integer, format: int64 }
        qty: { type: string, example: "5000", description: "base units received: an exact decimal STRING, more than 0, at most 4 decimal places" }
        total_cost: { type: integer, format: int64, minimum: 0, description: "whole rupiah paid for all of it" }
        supplier: { type: string, maxLength: 80 }
        doc_no: { type: string, maxLength: 40 }
        note: { type: string, maxLength: 500 }
        idempotency_key: { type: string, maxLength: 100, description: "a retry with the same key returns the original movement instead of booking it twice" }
    StockWasteBody:
      type: object
      required: [outlet_id, material_id, qty, reason]
      properties:
        outlet_id: { type: integer, format: int64 }
        material_id: { type: integer, format: int64 }
        qty: { type: string, example: "250", description: "an exact decimal STRING, more than 0, at most 4 decimal places" }
        reason: { type: string, enum: [expired, damaged, spilled, lost, other] }
        note: { type: string, maxLength: 500 }
        idempotency_key: { type: string, maxLength: 100 }
    StockAdjustBody:
      type: object
      required: [outlet_id, material_id, counted_qty, note]
      properties:
        outlet_id: { type: integer, format: int64 }
        material_id: { type: integer, format: int64 }
        counted_qty: { type: string, example: "4980.5", description: "what was counted: an exact decimal STRING, 0 or more, at most 4 decimal places" }
        note: { type: string, maxLength: 500, description: "required: it is the stock count" }
        idempotency_key: { type: string, maxLength: 100 }
    StockTransferBody:
      type: object
      required: [from_outlet_id, to_outlet_id, material_id, qty]
      properties:
        from_outlet_id: { type: integer, format: int64 }
        to_outlet_id: { type: integer, format: int64, description: "a different outlet" }
        material_id: { type: integer, format: int64 }
        qty: { type: string, description: "an exact decimal STRING, more than 0, at most 4 decimal places" }
        note: { type: string, maxLength: 500 }
        idempotency_key: { type: string, maxLength: 100 }
    StockMinBody:
      type: object
      required: [outlet_id, material_id, min_qty]
      properties:
        outlet_id: { type: integer, format: int64 }
        material_id: { type: integer, format: int64 }
        min_qty: { type: string, example: "2000", description: "the reorder level: an exact decimal STRING, 0 or more; 0 turns the low-stock flag off" }
    OrderLine:
      type: object
      required: [name]
      properties:
        item_id: { type: integer, format: int64 }
        name: { type: string }
        unit: { type: string }
        price: { type: integer, format: int64, description: "per unit, already including the variant and the modifiers" }
        qty: { type: number }
        variant: { type: string, maxLength: 80, description: "the tier picked, e.g. Express" }
        variant_option_ids: { type: array, maxItems: 20, items: { type: integer, format: int64, minimum: 1 }, description: "the variant options chosen (catalog ids), kept only so the cost of the line can be reproduced; they play no part in the price" }
        modifier_option_ids: { type: array, maxItems: 20, items: { type: integer, format: int64, minimum: 1 }, description: "the modifier options chosen, likewise" }
        modifiers:
          type: array
          maxItems: 20
          items:
            type: object
            required: [name]
            properties:
              group: { type: string }
              name: { type: string }
              price: { type: integer, format: int64, description: "added per unit" }
    CreateOrder:
      type: object
      required: [id, outlet_id, customer_name, lines]
      properties:
        code: { type: string, pattern: "^TRX-[0-9]{8}-[ABCDEFGHJKLMNPQRSTUVWXYZ23456789]{4}$", example: "TRX-25102026-K7M2", description: "optional: the order's human-readable code, which the POS may build offline so the cashier sees it at once (TRX-DDMMYYYY-XXXX: a real day, four characters from an alphabet without 0, O, 1, I). Kept if well-formed and not used by another order; otherwise the server makes its own. Either way the order that comes back carries the code that stuck, and a retry of an id already stored returns the stored code whatever this says." }
        id: { type: string, description: Client-generated id; the call is idempotent on it. }
        outlet_id: { type: integer, format: int64 }
        customer_name: { type: string }
        customer_phone: { type: string }
        lines:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/OrderLine" }
    BannerBody:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        internal_notes: { type: string, maxLength: 500, description: "head office's private note; never sent to the app" }
        image_url: { type: string, maxLength: 500, description: "the address an upload returned (https; http only for localhost in dev)" }
        target_type: { type: string, enum: [none, service, outlet, screen, external], default: none, description: "what a tap opens" }
        target_value: { type: string, description: "a service id or an outlet id (it must exist), a screen key (see GET /backoffice/v1/banners/screens), a full https address for external; empty for none. A number is accepted for an id." }
        status: { type: string, enum: [active, inactive], default: inactive, description: "active needs an image" }
        starts_at: { type: string, format: date-time, nullable: true, description: "RFC 3339; kept to the second; null or empty = no start" }
        ends_at: { type: string, format: date-time, nullable: true, description: "RFC 3339; must be after starts_at; null or empty = no end. The banner stops showing the instant it is reached." }
        outlet_ids: { type: array, maxItems: 200, items: { type: integer, format: int64, minimum: 1 }, description: "show only at these outlets; empty = every outlet" }
    BannerOrder:
      type: object
      required: [ids]
      properties:
        ids: { type: array, items: { type: integer, format: int64 }, description: "every banner exactly once, first shown first" }
    VoucherBody:
      type: object
      required: [title, discount_type, value]
      properties:
        code: { type: string, description: "4 to 20 capital letters or digits (it is upper-cased for you); empty = a public voucher, which is in every wallet while it is live. Unique across vouchers (409 when taken)." }
        title: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 500, description: "shown to customers" }
        internal_notes: { type: string, maxLength: 500, description: "head office's private note; never sent to the app" }
        discount_type: { type: string, enum: [percentage, amount] }
        value: { type: integer, format: int64, description: "1 to 100 for a percentage, whole rupiah (1 to 1000000000) for an amount; a fraction is refused" }
        max_discount: { type: integer, format: int64, minimum: 0, default: 0, description: "rupiah cap of a percentage; 0 = no cap; only a percentage may have one" }
        min_spend: { type: integer, format: int64, minimum: 0, default: 0, description: "rupiah an order must come to; 0 = none" }
        max_claims: { type: integer, minimum: 0, default: 0, description: "how many customers may hold it; 0 = no limit; only a voucher with a code may set one, and not below the number who hold it already" }
        usage_limit: { type: integer, minimum: 1, maximum: 1000, default: 1, description: "how many times one customer may spend it" }
        status: { type: string, enum: [active, inactive], default: inactive }
        color: { type: string, description: "the coupon's colour, one of GET /backoffice/v1/vouchers/colors; the first when left out" }
        image_url: { type: string, maxLength: 500, description: "the address an upload returned (folder vouchers)" }
        starts_at: { type: string, format: date-time, nullable: true, description: "RFC 3339; kept to the second; null or empty = no start" }
        ends_at: { type: string, format: date-time, nullable: true, description: "RFC 3339; must be after starts_at; null or empty = no end. The voucher stops being usable the instant it is reached." }
        outlet_ids: { type: array, maxItems: 200, items: { type: integer, format: int64, minimum: 1 }, description: "usable only at these outlets; empty = every outlet" }
        service_ids: { type: array, maxItems: 200, items: { type: integer, format: int64, minimum: 1 }, description: "usable only on these services; empty = every service" }
    VoucherInject:
      type: object
      properties:
        customer_ids: { type: array, items: { oneOf: [{ type: integer, format: int64 }, { type: string }] }, description: "customer ids, as numbers or text" }
        phones: { type: array, items: { type: string }, description: "phone numbers as typed (0812…, +62 812…, 62812…)" }
        expires_at: { type: string, format: date-time, nullable: true, description: "when these copies stop being usable; must be in the future; null = when the voucher ends" }
    UserStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [active, inactive, banned]
    OrderStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [created, processing, ready, fulfilled, cancelled]
  responses:
    Ok:
      description: Envelope
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
paths:
  /app/v1/register:
    post:
      tags: [App auth]
      summary: Start sign-up and send a one-time code
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/Register" } } }
      responses: { "200": { $ref: "#/components/responses/Ok" } }
  /app/v1/verify-otp:
    post:
      tags: [App auth]
      summary: Exchange the code for tokens
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/Verify" } } }
      responses: { "200": { $ref: "#/components/responses/Ok" } }
  /app/v1/suggest-username:
    get:
      tags: [App auth]
      parameters:
        - { name: name, in: query, schema: { type: string } }
        - { name: birth_date, in: query, schema: { type: string } }
      responses: { "200": { $ref: "#/components/responses/Ok" } }
  /app/v1/check-username:
    get:
      tags: [App auth]
      parameters:
        - { name: username, in: query, required: true, schema: { type: string } }
      responses: { "200": { $ref: "#/components/responses/Ok" } }
  /app/v1/me:
    get:
      tags: [App auth]
      security: [{ bearer: [] }]
      responses: { "200": { $ref: "#/components/responses/Ok" } }
  /app/v1/me/summary:
    get:
      tags: [App auth]
      summary: Membership summary
      security: [{ bearer: [] }]
      responses: { "200": { $ref: "#/components/responses/Ok" } }
  /app/v1/refresh:
    post:
      tags: [App auth]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AppRefresh" } } }
      responses: { "200": { $ref: "#/components/responses/Ok" } }
  /app/v1/logout:
    post:
      tags: [App auth]
      responses: { "200": { $ref: "#/components/responses/Ok" } }
  /app/v1/outlets:
    get:
      tags: [App catalog]
      summary: All active outlets (plain list)
