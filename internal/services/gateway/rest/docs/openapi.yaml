        - { name: limit, in: query, description: "Page size; 10 when left out or 0 or less, at most 100", schema: { type: integer, maximum: 100, default: 10 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: service_id, in: query, description: "Only the groups linked to this service; an unknown id gives an empty list", schema: { type: integer, format: int64, minimum: 1 } }
        - { name: usage, in: query, description: "used = linked to at least one service, unused = to none; leave out for all", schema: { type: string, enum: [used, unused] } }
        - { name: requirement, in: query, description: "required = min 1 or more, optional = min 0; leave out for all", schema: { type: string, enum: [required, optional] } }
