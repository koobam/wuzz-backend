      description: "Removes the service with its links to variant and modifier groups and its own recipe; the groups and every other recipe stay. Orders keep their own copy of what they sold. Refused with 409, naming the banners or vouchers, while a banner opens the service or a voucher is limited to it. 404 for an unknown id."
      security: [{ bearer: [] }]
