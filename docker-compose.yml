# Local development. Single-node and disposable.
name: wuzz-backend

x-service-env: &service-env
  APP_ENV: dev
  LOG_FORMAT: text
  LOG_LEVEL: debug
  # No JWT keys here on purpose — see authn/keys.go: every service falls back
  # to the same fixed development keypair with nothing configured.
  REDIS_ADDR: redis:6379
  KAFKA_BROKERS: kafka:9092
  HTTP_ADDR: ":8080"
  GRPC_ADDR: ":9090"
  TWILIO_DEV_MODE: "true"

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: wuzz
      POSTGRES_PASSWORD: wuzz
      POSTGRES_DB: wuzz
    # Host port 5433, not 5432 — something else on dev machines here already
    # listens on 5432 (an SSH tunnel to a remote Postgres, going by `lsof`).
    ports: ["5433:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wuzz"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    # Host port 6380, not 6379 — the reddog-backend stack's redis is already
    # on 6379 on this machine.
    ports: ["6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mongo:
    image: mongo:7
    # Chat history (wuzz-support). Host port 27018, not 27017, to stay clear of
    # any Mongo already running on the machine.
    ports: ["27018:27017"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.9.0
    # 9092 is for services inside compose, 29092 for `make run` on the host. A
    # client reconnects to whatever address the broker advertises, so each side
    # needs its own.
    ports: ["29092:29092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  migrate-user:
    build:
      context: .
      args: {SERVICE: migrate}
    entrypoint: ["/app/service"]
    environment:
      <<: *service-env
      MIGRATE_SERVICE: user
      POSTGRES_DSN: postgres://wuzz:wuzz@postgres:5432/wuzz?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  user:
    build:
      context: .
      args: {SERVICE: user}
    environment:
      <<: *service-env
      POSTGRES_DSN: postgres://wuzz:wuzz@postgres:5432/wuzz?sslmode=disable
    # Host port 8091, not 8081 — reddog-backend's user service is already on
    # 8081 on this machine.
    ports: ["8091:8080", "9090:9090"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      migrate-user:
        condition: service_completed_successfully

  migrate-catalog:
    build:
      context: .
      args: {SERVICE: migrate}
    entrypoint: ["/app/service"]
    environment:
      <<: *service-env
      MIGRATE_SERVICE: catalog
      POSTGRES_DSN: postgres://wuzz:wuzz@postgres:5432/wuzz_catalog?sslmode=disable
    depends_on:
      db-init:
        condition: service_completed_successfully

  migrate-transaction:
    build:
      context: .
      args: {SERVICE: migrate}
    entrypoint: ["/app/service"]
    environment:
      <<: *service-env
      MIGRATE_SERVICE: transaction
      POSTGRES_DSN: postgres://wuzz:wuzz@postgres:5432/wuzz_transaction?sslmode=disable
    depends_on:
      db-init:
        condition: service_completed_successfully

  # One database per service, created once.
  db-init:
    image: postgres:17-alpine
    environment:
      PGPASSWORD: wuzz
    entrypoint:
      - sh
      - -c
      - |
        for db in wuzz_catalog wuzz_transaction; do
          psql -h postgres -U wuzz -tc "select 1 from pg_database where datname='$$db'" | grep -q 1 || psql -h postgres -U wuzz -c "create database $$db"
        done
    depends_on:
      postgres:
        condition: service_healthy

  catalog:
    build:
      context: .
      args: {SERVICE: catalog}
    environment:
      <<: *service-env
      POSTGRES_DSN: postgres://wuzz:wuzz@postgres:5432/wuzz_catalog?sslmode=disable
    depends_on:
      kafka:
        condition: service_healthy
      migrate-catalog:
        condition: service_completed_successfully

  transaction:
    build:
      context: .
      args: {SERVICE: transaction}
    environment:
      <<: *service-env
      POSTGRES_DSN: postgres://wuzz:wuzz@postgres:5432/wuzz_transaction?sslmode=disable
    depends_on:
      kafka:
        condition: service_healthy
      migrate-transaction:
        condition: service_completed_successfully

  gateway:
    build:
      context: .
      args: {SERVICE: gateway}
    environment:
      <<: *service-env
      USER_ADDR: user:9090
      CATALOG_ADDR: catalog:9090
      TRANSACTION_ADDR: transaction:9090
      CORS_ORIGINS: http://localhost:5174
      COOKIE_SECURE: "false"
    # Host port 8092, not 8080 — reddog-backend's gateway is already on 8080
    # on this machine.
    ports: ["8092:8080"]
    depends_on: [user, catalog, transaction]

volumes:
  postgres-data:
  mongo-data:
